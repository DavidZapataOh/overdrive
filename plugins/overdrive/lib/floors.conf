# Built-in risk floors. Same grammar as a project's .overdrive/risk-map.conf
# (docs/risk-map.md); a project map can add rules but never remove these.
# Items computed from the diff itself (test-removed, untested-change, deletion,
# exec-bit) are not expressible as rules and live in the classifier.
#
# File-name globs start with **/ so they also match inside monorepo packages.
# SQL is case-insensitive, so its rules accept the upper- and lowercase spellings.

# data-migration
path      **/migrations/**                                   data-migration  critical
path      **/*.sql                                           data-migration  critical
path      **/schema.prisma                                   data-migration  critical
path      **/drizzle/**                                      data-migration  critical
path      **/alembic/**                                      data-migration  critical
content   DROP[[:space:]]+TABLE|drop[[:space:]]+table        data-migration  critical
content   DROP[[:space:]]+COLUMN|drop[[:space:]]+column      data-migration  critical
content   ALTER[[:space:]]+TABLE|alter[[:space:]]+table      data-migration  critical
content   (^|[^A-Za-z0-9_])TRUNCATE([^A-Za-z0-9_]|$)|truncate[[:space:]]+table  data-migration  critical
content   DELETE[[:space:]]+FROM|delete[[:space:]]+from      data-migration  critical

# auth
pathtoken auth         auth  critical
pathtoken authn        auth  critical
pathtoken authz        auth  critical
pathtoken session      auth  critical
pathtoken sessions     auth  critical
pathtoken permission   auth  critical
pathtoken permissions  auth  critical
pathtoken rbac         auth  critical
pathtoken acl          auth  critical
pathtoken oauth        auth  critical
pathtoken jwt          auth  critical
pathtoken login        auth  critical
pathtoken logout       auth  critical
pathtoken password     auth  critical
pathtoken passwords    auth  critical
pathtoken credential   auth  critical
pathtoken credentials  auth  critical
content   bcrypt            auth  critical
content   argon2            auth  critical
content   verifyToken       auth  critical
content   getServerSession  auth  critical

# tenant-isolation
pathtoken tenant   tenant-isolation  critical
pathtoken tenants  tenant-isolation  critical
pathtoken tenancy  tenant-isolation  critical
pathtoken rls      tenant-isolation  critical
content   ROW[[:space:]]+LEVEL[[:space:]]+SECURITY|row[[:space:]]+level[[:space:]]+security  tenant-isolation  critical
content   CREATE[[:space:]]+POLICY|create[[:space:]]+policy  tenant-isolation  critical
content   tenant_id  tenant-isolation  critical
content   tenantId   tenant-isolation  critical

# money
pathtoken billing        money  critical
pathtoken payment        money  critical
pathtoken payments       money  critical
pathtoken checkout       money  critical
pathtoken invoice        money  critical
pathtoken invoices       money  critical
pathtoken invoicing      money  critical
pathtoken subscription   money  critical
pathtoken subscriptions  money  critical
pathtoken refund         money  critical
pathtoken refunds        money  critical
pathtoken payout         money  critical
pathtoken payouts        money  critical
pathtoken charge         money  critical
pathtoken charges        money  critical

# secrets
path      **/.env             secrets  critical
path      **/.env.*           secrets  critical
path      **/*.pem            secrets  critical
path      **/*.key            secrets  critical
path      **/*secret*         secrets  critical
path      **/credentials*     secrets  critical
content   AKIA[0-9A-Z]{16}              secrets  critical
content   sk_live_[0-9a-zA-Z]{10,}      secrets  critical
content   "-----BEGIN [A-Z ]*PRIVATE KEY-----"  secrets  critical
content   gh[pousr]_[A-Za-z0-9]{36}     secrets  critical
content   xox[baprs]-                   secrets  critical
content   (api[_-]?key|secret|token|password)[[:space:]]*[:=][[:space:]]*["'][^"']{12,}  secrets  critical

