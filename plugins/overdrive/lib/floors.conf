path      **/fly.toml                delivery  critical
path      **/deploy/**               delivery  critical
path      .husky/**                  delivery  critical
path      lefthook.yml               delivery  critical
path      lefthook.yaml              delivery  critical
path      .pre-commit-config.yaml    delivery  critical
path      CODEOWNERS                 delivery  critical
path      .github/CODEOWNERS         delivery  critical
path      docs/CODEOWNERS            delivery  critical
path      renovate.json*             delivery  critical
path      .github/renovate.json*     delivery  critical
