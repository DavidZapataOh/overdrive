# public-contract
path      **/*.proto     public-contract  critical
path      **/*.graphql   public-contract  critical
path      **/openapi*    public-contract  critical
path      **/swagger*    public-contract  critical
path      **/api/**      public-contract  critical

# concurrency
content   FOR[[:space:]]+UPDATE|for[[:space:]]+update        concurrency  critical
content   SKIP[[:space:]]+LOCKED|skip[[:space:]]+locked      concurrency  critical
content   advisory_lock                                      concurrency  critical
content   pg_advisory                                        concurrency  critical
content   Mutex                                              concurrency  critical
content   Semaphore                                          concurrency  critical
content   Atomics\.                                          concurrency  critical
content   (^|[^A-Za-z0-9_])SERIALIZABLE([^A-Za-z0-9_]|$)     concurrency  critical
content   [Ii]solation[[:space:]]*[Ll]evel|ISOLATION[[:space:]]+LEVEL  concurrency  critical

