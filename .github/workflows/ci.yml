name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: claude plugin validate --strict .
      - run: claude plugin validate --strict plugins/overdrive

  shell:
    name: shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name == 'pull_request' || github.ref == 'refs/heads/main') && '[{"os":"ubuntu-latest","shell":"bash","bash":"bash"},{"os":"macos-latest","shell":"/bin/bash {0}","bash":"/bin/bash"},{"os":"windows-latest","shell":"bash","bash":"bash"}]' || '[{"os":"ubuntu-latest","shell":"bash","bash":"bash"}]') }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show bash version
        run: ${{ matrix.bash }} -c 'echo "$BASH_VERSION"'
      - name: Shellcheck
        if: runner.os == 'Linux'
        run: >
          git ls-files -z '*.sh' 'plugins/overdrive/bin/*' 'plugins/overdrive/libexec/*' 'plugins/overdrive/hooks/*'
          'plugins/overdrive/skills/*/scripts/*'
          ':!*.json' ':!*.md' ':!*.conf' | xargs -0 -r shellcheck -x
      - name: Tests
        run: ${{ matrix.bash }} tests/run.sh

  skills:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash tools/check-skills.sh plugins/overdrive
      - name: Shipped split-trigger-set matches the eval tool
        run: cmp tools/evals/split-trigger-set.sh plugins/overdrive/skills/skill-evaluation/scripts/split-trigger-set

  budget:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash tools/check-budget.sh plugins/overdrive

  terms:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OVERDRIVE_FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash tools/check-forbidden-terms.sh --range "$BASE_SHA..$HEAD_SHA"
      - name: Push
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          base=$BEFORE_SHA
          if [ -z "${base//0/}" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git merge-base origin/main "$AFTER_SHA" 2>/dev/null || git rev-list --max-parents=0 "$AFTER_SHA" | tail -n 1)
          fi
          bash tools/check-forbidden-terms.sh --range "$base..$AFTER_SHA"
