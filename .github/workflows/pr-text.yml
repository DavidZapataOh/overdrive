name: pr-text

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

concurrency:
  group: pr-text-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  terms:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OVERDRIVE_FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash tools/check-forbidden-terms.sh --pr-event "$GITHUB_EVENT_PATH"
