<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="The three lanes: direct, standard and critical, and what each brings">
<title>The three lanes</title>
<rect width="960" height="440" rx="16" fill="#0d1117"/>
<text x="30" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#e6edf3">One classifier, three lanes</text>
<text x="930" y="40" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9da7b3">Process grows with the risk of the change</text>
<rect x="30" y="70" width="290" height="330" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><rect x="30" y="70" width="290" height="6" rx="3" fill="#3fb950"/><text x="54" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="#e6edf3">direct</text><text x="54" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9da7b3">Trivial edits</text><text x="54" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#3fb950">PLANNING</text><text x="54" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#c9d1d9">None</text><text x="54" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#3fb950">REVIEW</text><text x="54" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#c9d1d9">Reread the diff</text><text x="54" y="284" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#3fb950">EVIDENCE</text><text x="54" y="304" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#c9d1d9">The change's own check</text><text x="54" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#c9d1d9">run in the turn</text>
<rect x="335" y="70" width="290" height="330" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><rect x="335" y="70" width="290" height="6" rx="3" fill="#c4872a"/><text x="359" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="#e6edf3">standard</text><text x="359" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9da7b3">Ordinary work</text><text x="359" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#c4872a">PLANNING</text><text x="359" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#c9d1d9">Short decision plan</text><text x="359" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#c4872a">REVIEW</text><text x="359" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#c9d1d9">One reviewer per slice,</text><text x="359" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#c9d1d9">before any pull request</text><text x="359" y="304" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#c4872a">EVIDENCE</text><text x="359" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#c9d1d9">Test-driven where it applies</text><text x="359" y="344" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#c9d1d9">green evidence on record</text>
<rect x="640" y="70" width="290" height="330" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><rect x="640" y="70" width="290" height="6" rx="3" fill="#f85149"/><text x="664" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="#e6edf3">critical</text><text x="664" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9da7b3">Data, auth, money, secrets</text><text x="664" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#f85149">PLANNING</text><text x="664" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#c9d1d9">Test-first plan you approve</text><text x="664" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#c9d1d9">before the risky part is touched</text><text x="664" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#f85149">REVIEW</text><text x="664" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#c9d1d9">Critical review after every task</text><text x="664" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#c9d1d9">then one final review</text><text x="664" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#f85149">EVIDENCE</text><text x="664" y="344" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#c9d1d9">Red and green evidence,</text><text x="664" y="364" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#c9d1d9">pinned tests, a builder per task</text>
<text x="30" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#9da7b3">Claude can raise a lane, never lower it. Only you can lower one, and the answer is recorded as a decision.</text>
</svg>
